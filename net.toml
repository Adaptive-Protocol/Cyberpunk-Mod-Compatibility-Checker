# The Framework Net's list, read by the app (built in, or a newer copy placed next to the exe). Separate from compat.toml,
# which v1.x apps read and which must stay schema 1 for them (docs/adr/0001-net-list-file.md).
# Maintained by the bridge agent (.claude/agents/compat-bridge.md) and reviewed by the maintainer.
#
# core:     an archive Suite core, which the app can't tell from its files alone. Script cores need no entry: the app
#           reads which mods import their modules, and their version markers (DigitalVixenCore.Api4_9_14).
#   detect:   paths (with * in a name) that find the core; two installed copies are red.
#   needs:    framework names, as in compat.toml.
#   reach:    "contained" or "engine", to correct what the app reads from the files.
#   versions: { version, fingerprint }: the fingerprint is the FNV-1a 64 hash of the archive's whole file index, in hex.
#   suite:    { detect, min }: the Suite mods that need the core, and the lowest core version they work with, if known.
#   source, date: where the entry was checked.
# reach:    a correction for any mod: { detect, reach, why }.

schema = 1
updated = "2026-11-25"

# 2026-11-25: the archive cores on the maintainer's install. Each fingerprint was read from the archive in that version's
# Nexus download and matches the installed copy. Suite globs are by file name, and only where the author's naming is clear.

