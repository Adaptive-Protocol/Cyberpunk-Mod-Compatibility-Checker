[package]
name = "cyberpunk-mod-compat-checker"
version = "2.0.0"
edition = "2024"
description = "Cyberpunk Mod Compatibility Checker"
license = "MIT"
repository = "https://github.com/Adaptive-Protocol/Cyberpunk-Mod-Compatibility-Checker"
publish = false

[[bin]]
name = "CyberpunkModCompatibilityChecker"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", features = ["persistence"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
toml = "1"
# Pre-install check: read a mod's .7z or .zip in memory (pure Rust, no C code) and its FOMOD installer
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["ppmd", "deflate", "bzip2"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2", "deflate64"] }
quick-xml = "0.42.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
